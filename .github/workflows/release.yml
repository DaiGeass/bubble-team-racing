name: release

# Tag a version (v1.0.0) or run it by hand to publish the desktop installers.
# Linux produces .deb + .AppImage, Windows produces the NSIS .exe + the WiX .msi.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish this build to (v1.0.0)"
        required: false
        default: "v1.0.0"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.label }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux (deb + AppImage)
            os: ubuntu-22.04
            platform: linux-x86_64
            bundles: deb,appimage
          - label: windows (exe + msi)
            os: windows-latest
            platform: windows-x86_64
            bundles: nsis,msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: juego/package-lock.json

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev build-essential file

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'windows-x86_64' && 'x86_64-pc-windows-msvc' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: juego/src-tauri -> target
          key: ${{ matrix.platform }}

      - name: Install frontend dependencies
        working-directory: juego
        run: npm ci

      - name: Type check and build the web bundle
        working-directory: juego
        run: |
          npx tsc --noEmit
          npm run build

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: juego
          args: --bundles ${{ matrix.bundles }}
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: Bubble Team Racing ${{ github.event.inputs.tag || github.ref_name }}
          releaseBody: |
            Aero kart racing: 14 circuits with gaps and stacked shortcuts,
            28 characters, 24 chassis, 6 finishes and 6 modes.

            * Windows: NSIS installer (.exe) and MSI package
            * Linux: .deb package and AppImage
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false

  summary:
    name: release assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: List what landed on the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          echo "assets for ${TAG}:"
          gh release view "${TAG}" --json assets --jq '.assets[] | "\(.name)\t\(.size) bytes"'