[package]
name = "bubble-team-racing"
version = "1.0.0"
description = "Aero kart racing with 14 circuits, gaps, shortcuts and fusion turrets"
authors = ["Bubble Team"]
license = "GPL-3.0-or-later"
repository = "https://github.com/DaiGeass/bubble-team-racing"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "bubble_team_racing_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
